name: "{{COMPONENT_NAME}}"
version: "{{VERSION}}"
license: "MIT"
description: "{{DESCRIPTION}}"
url: "{{REPO_URL}}"
repository: "{{REPO_URL}}"
documentation: "{{REPO_URL}}/tree/main/README.md"
issues: "{{REPO_URL}}/issues"
# Chips this component supports. Remove the ones you do not test/support.
targets:
  - esp32
  - esp32s2
  - esp32s3
  - esp32c3
  - esp32c5
  - esp32c6
  - esp32h2
  - esp32p4
# Search keywords on components.espressif.com. Adjust to the component's domain.
tags:
  - esp32
examples:
  - path: examples/basic
dependencies:
  idf: ">={{IDF_MIN_VERSION}}"
